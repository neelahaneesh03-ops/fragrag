services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fragrag_postgres
    environment:
      POSTGRES_USER: fragrag
      POSTGRES_PASSWORD: fragrag_dev
      POSTGRES_DB: fragrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: